

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - IT 자산관리 시스템</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth/auth.css}">
</head>
<body class="auth-body">

<header class="site-header">
    <a th:href="@{/}" class="logo"><span class="dot"></span>IT 자산관리 시스템</a>
    <nav>
        <a th:href="@{/}">홈</a>
        <a th:href="@{/signup}" class="primary">회원가입</a>
    </nav>
</header>

<div class="auth-wrap">
    <div class="auth-card fade-up">
        <div class="auth-icon">🔐</div>
        <h1>다시 오셨네요</h1>
        <p class="auth-sub">계정 정보를 입력해 로그인하세요</p>

        <p class="auth-msg auth-msg-error" th:if="${param.error}">
            아이디 또는 비밀번호가 올바르지 않습니다.
        </p>
        <p class="auth-msg auth-msg-success" th:if="${param.signup}">
            회원가입이 완료되었습니다. 로그인해 주세요.
        </p>
        <p class="auth-msg auth-msg-success" th:if="${param.logout}">
            로그아웃되었습니다.
        </p>

        <form th:action="@{/login}" method="post" class="auth-form" id="loginForm">
            <div class="input-group">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username" placeholder="아이디를 입력하세요" required autofocus/>
            </div>

            <div class="input-group">
                <label for="password">비밀번호</label>
                <div class="password-wrap">
                    <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required/>
                    <button type="button" class="password-toggle">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary auth-submit">로그인</button>
        </form>

        <div class="auth-footer-link">
            아직 계정이 없으신가요? <a th:href="@{/signup}">회원가입</a>
        </div>
    </div>
</div>

<footer class="site-footer">
    <div class="footer-title">IT 자산관리 시스템 · Portfolio Project</div>
    <div class="footer-contact">
        <span>👤 김민찬</span>
        <span>✉️ kmc34633@naver.com</span>
        <span>📞 010-3463-5279</span>
    </div>
    <div class="footer-copy">&copy; 2026 Minchan Kim. All rights reserved.</div>
</footer>

<script th:src="@{/js/auth/auth.js}"></script>
<script th:src="@{/js/auth/login.js}"></script>
</body>
</html>
