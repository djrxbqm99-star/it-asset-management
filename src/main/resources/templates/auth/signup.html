
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - IT 자산관리 시스템</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            font-size: 16px;
            background: #f5f5f3;
            margin: 0;
        }
        .box {
            max-width: 400px;
            margin: 80px auto;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 40px;
        }
        h1 {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 24px;
            text-align: center;
        }
        label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            height: 44px;
            font-size: 16px;
            padding: 0 12px;
            margin-bottom: 16px;
            border: 1px solid #bbb;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            height: 48px;
            font-size: 18px;
            font-weight: 500;
            background: #2f6fed;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
        }
        .field-error {
            color: #c0392b;
            font-size: 13px;
            margin: -10px 0 12px;
        }
        .msg.error {
            color: #c0392b;
            font-size: 14px;
            margin-bottom: 16px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>회원가입</h1>

    <p class="msg error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <form th:action="@{/signup}" th:object="${signupRequestDto}" method="post">
        <label for="username">아이디</label>
        <input type="text" id="username" th:field="*{username}" placeholder="4자 이상 입력"/>
        <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>

        <label for="password">비밀번호</label>
        <input type="password" id="password" th:field="*{password}" placeholder="4자 이상 입력"/>
        <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

        <label for="name">이름</label>
        <input type="text" id="name" th:field="*{name}" placeholder="실명 입력"/>
        <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

        <label for="department">부서</label>
        <input type="text" id="department" th:field="*{department}" placeholder="예: 개발팀 (선택)"/>

        <button type="submit">가입하기</button>
    </form>
</div>

</body>
</html>
